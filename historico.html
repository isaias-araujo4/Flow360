<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — Flow360</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <main class="conteudo" id="conteudo">
      <div class="cabecalho-pagina">
        <h1 class="titulo-pagina">Histórico</h1>
      </div>

      <section class="cartao">
        <h2 class="cartao-titulo" id="titulo-historico">Registro de atividades</h2>
        <p class="texto-suave" id="ultima-acao" style="margin-top:-6px"></p>

        <div class="grade-campos" id="filtro-usuario">
          <div class="campo">
            <label for="h-usuario">Usuário</label>
            <select class="selecao" id="h-usuario"></select>
          </div>
        </div>

        <div class="abas" role="tablist">
          <button class="btn" type="button" data-aba="atividades">Todas as atividades</button>
          <button class="btn" type="button" data-aba="verificacoes">Verificações</button>
          <button class="btn" type="button" data-aba="competencias">Competências passadas</button>
        </div>

        <div id="tabela-historico"></div>
      </section>
    </main>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/paginas/historico.js"></script>
</body>
</html>
